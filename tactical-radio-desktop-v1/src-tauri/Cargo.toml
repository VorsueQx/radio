[package]
name = "tactical-radio"
version = "1.0.0"
description = "2-4 kisilik Tactical Radio masaustu istemcisi"
authors = ["Irmak Studio"]
edition = "2021"

[lib]
name = "tactical_radio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
